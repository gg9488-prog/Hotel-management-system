<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Saveur — Staff</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .staff-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:20px; }
    .staff-card {
      background:var(--bg-card); border:1px solid var(--border);
      border-radius:var(--radius-lg); padding:24px; text-align:center;
      transition:var(--transition); animation:fadeInUp 0.4s ease both;
    }
    .staff-card:hover { border-color:var(--border-glow); transform:translateY(-3px); box-shadow:var(--shadow-card); }
    .staff-avatar {
      width:64px; height:64px; border-radius:50%; background:var(--gold-dim);
      display:flex; align-items:center; justify-content:center;
      font-size:24px; font-weight:700; color:var(--gold-light);
      border:2px solid var(--border); margin:0 auto 14px;
    }
    .staff-name { font-family:'Cormorant Garamond',serif; font-size:19px; font-weight:600; color:var(--text-primary); margin-bottom:4px; }
    .staff-role { font-size:12px; color:var(--text-muted); margin-bottom:10px; }
    .staff-stats { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:14px 0; }
    .staff-stat { background:var(--bg-surface); border-radius:8px; padding:8px; }
    .staff-stat-val { font-size:15px; font-weight:700; color:var(--gold-light); }
    .staff-stat-lbl { font-size:10px; color:var(--text-muted); }
  </style>
</head>
<body>
<aside class="sidebar">
  <div class="sidebar-logo"><span class="logo-icon">🍽️</span><h1>Saveur</h1><span>Restaurant Suite</span></div>
  <nav class="sidebar-nav">
    <div class="nav-section-label">Main</div>
    <a href="index.html" class="nav-link"><span class="nav-icon">📊</span><span>Dashboard</span></a>
    <a href="order.html" class="nav-link"><span class="nav-icon">📋</span><span>Orders</span><span class="nav-badge">5</span></a>
    <a href="menu.html" class="nav-link"><span class="nav-icon">🧾</span><span>Menu</span></a>
    <a href="tables.html" class="nav-link"><span class="nav-icon">🪑</span><span>Tables</span></a>
    <div class="nav-section-label">People</div>
    <a href="customer.html" class="nav-link"><span class="nav-icon">👤</span><span>Customers</span></a>
    <a href="staff.html" class="nav-link active"><span class="nav-icon">👨‍🍳</span><span>Staff</span></a>
    <div class="nav-section-label">Finance</div>
    <a href="reports.html" class="nav-link"><span class="nav-icon">📈</span><span>Reports</span></a>
    <a href="feedback.html" class="nav-link"><span class="nav-icon">⭐</span><span>Feedback</span></a>
    <a href="settings.html" class="nav-link"><span class="nav-icon">⚙️</span><span>Settings</span></a>
  </nav>
    <div class="sidebar-footer">
    <div style="padding:12px 20px 8px;border-top:1px solid var(--border);margin-top:auto;">
      <div style="font-size:12px;color:var(--text-muted);margin-bottom:10px;">
        Signed in as <span id="sidebar-username" style="color:var(--gold-light);font-weight:600;">Admin</span>
      </div>
      <button onclick="saveurLogout()" style="width:100%;padding:9px 14px;background:rgba(224,92,92,0.1);border:1px solid rgba(224,92,92,0.25);border-radius:8px;color:#e05c5c;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;transition:all 0.2s;" onmouseover="this.style.background='rgba(224,92,92,0.2)'" onmouseout="this.style.background='rgba(224,92,92,0.1)'">
        🚪 Sign Out
      </button>
    </div>
  </div>
</aside>
<main class="main">
  <div class="page-header">
    <div class="breadcrumb">Staff Management</div>
    <h2>Staff & Crew 👨‍🍳</h2>
    <p>Manage your team, roles, shifts and performance.</p>
  </div>
  <div class="toolbar">
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input class="form-control" type="text" id="staffSearch" placeholder="Search staff…" oninput="renderStaff()">
    </div>
    <select class="form-control" id="roleFilter" style="width:140px;" onchange="renderStaff()">
      <option value="">All Roles</option>
      <option>Waiter</option><option>Kitchen</option><option>Cashier</option><option>Manager</option>
    </select>
    <button class="btn btn-primary" onclick="openAddStaff()">+ Add Staff</button>
  </div>
  <div class="staff-grid" id="staffGrid"></div>
</main>

<div class="modal-overlay" id="staffModal">
  <div class="modal">
    <div class="modal-title" id="staffModalTitle">Add Staff Member</div>
    <div class="modal-subtitle">Enter staff details below</div>
    <div class="form-grid">
      <div class="form-group full"><label>Full Name</label><input class="form-control" id="sName" placeholder="e.g. Ravi Kumar"></div>
      <div class="form-group"><label>Role</label>
        <select class="form-control" id="sRole">
          <option>Waiter</option><option>Kitchen</option><option>Cashier</option><option>Manager</option>
        </select>
      </div>
      <div class="form-group"><label>Phone</label><input class="form-control" id="sPhone" placeholder="+91…"></div>
      <div class="form-group"><label>Shift</label>
        <select class="form-control" id="sShift">
          <option>Morning (8AM–3PM)</option><option>Evening (3PM–10PM)</option><option>Full Day</option>
        </select>
      </div>
      <div class="form-group"><label>Join Date</label><input class="form-control" type="date" id="sDate"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="document.getElementById('staffModal').classList.remove('open')">Cancel</button>
      <button class="btn btn-primary" onclick="saveStaff()">Save</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" style="display:none;">
  <span class="toast-icon" id="toastIcon">✅</span>
  <div><div class="toast-msg" id="toastMsg"></div><div class="toast-sub" id="toastSub"></div></div>
</div>
<script>
let staffList = [
  {id:1, name:'Admin Chef', role:'Manager', phone:'+91 98765 43210', shift:'Full Day', join:'2020-01-01', orders:0, rating:5.0, active:true},
  {id:2, name:'Ravi Kumar', role:'Waiter', phone:'+91 91234 56789', shift:'Evening (3PM–10PM)', join:'2022-03-15', orders:14, rating:4.8, active:true},
  {id:3, name:'Anita Sharma', role:'Waiter', phone:'+91 80987 65432', shift:'Evening (3PM–10PM)', join:'2021-08-20', orders:11, rating:4.7, active:true},
  {id:4, name:'Deepak Joshi', role:'Kitchen', phone:'+91 70876 54321', shift:'Full Day', join:'2020-05-10', orders:8, rating:4.6, active:true},
  {id:5, name:'Meena Pillai', role:'Cashier', phone:'+91 60765 43210', shift:'Morning (8AM–3PM)', join:'2023-01-05', orders:5, rating:4.9, active:false},
  {id:6, name:'Suresh Nair', role:'Kitchen', phone:'+91 50654 32109', shift:'Morning (8AM–3PM)', join:'2022-11-11', orders:0, rating:4.5, active:true},
];
let nextSId = 7;
const roleBadge = {Manager:'badge-gold', Waiter:'badge-info', Kitchen:'badge-warning', Cashier:'badge-success'};

function renderStaff() {
  const q = document.getElementById('staffSearch').value.toLowerCase();
  const r = document.getElementById('roleFilter').value;
  const list = staffList.filter(s => s.name.toLowerCase().includes(q) && (!r || s.role === r));
  document.getElementById('staffGrid').innerHTML = list.map((s,i) => `
    <div class="staff-card" style="animation-delay:${i*0.07}s">
      <div class="staff-avatar">${s.name[0]}</div>
      <div class="staff-name">${s.name}</div>
      <div class="staff-role"><span class="badge ${roleBadge[s.role]||'badge-info'}">${s.role}</span></div>
      <div style="font-size:11px;color:var(--text-muted);">${s.shift}</div>
      <div class="staff-stats">
        <div class="staff-stat"><div class="staff-stat-val">${s.orders}</div><div class="staff-stat-lbl">Orders Today</div></div>
        <div class="staff-stat"><div class="staff-stat-val">⭐${s.rating}</div><div class="staff-stat-lbl">Rating</div></div>
      </div>
      <div style="display:flex;gap:8px;justify-content:center;">
        <span class="badge ${s.active ? 'badge-success' : 'badge-danger'}">${s.active ? '● Active' : '● Off Duty'}</span>
      </div>
      <div style="margin-top:12px;display:flex;gap:6px;justify-content:center;">
        <button class="btn btn-outline btn-sm" onclick="toggleStaff(${s.id})">${s.active ? 'Mark Off' : 'Set Active'}</button>
        <button class="btn btn-danger btn-sm" onclick="removeStaff(${s.id})">Remove</button>
      </div>
    </div>
  `).join('') || '<p style="color:var(--text-muted);grid-column:1/-1;text-align:center;padding:40px;">No staff found.</p>';
}

function toggleStaff(id) {
  const s = staffList.find(s=>s.id===id);
  s.active = !s.active; renderStaff();
  showToast('Staff updated', s.name + (s.active ? ' set active.' : ' marked off duty.'), '👤');
}
function removeStaff(id) {
  const s = staffList.find(s=>s.id===id);
  if (!confirm('Remove ' + s.name + '?')) return;
  staffList = staffList.filter(s=>s.id!==id); renderStaff();
  showToast('Staff removed', s.name + ' deleted.', '🗑️');
}
function openAddStaff() {
  document.getElementById('sName').value=''; document.getElementById('sPhone').value='';
  document.getElementById('sDate').value=new Date().toISOString().split('T')[0];
  document.getElementById('staffModal').classList.add('open');
}
function saveStaff() {
  const name = document.getElementById('sName').value.trim();
  if (!name) { showToast('Missing info','Enter a name.','⚠️'); return; }
  staffList.push({id:nextSId++, name, role:document.getElementById('sRole').value,
    phone:document.getElementById('sPhone').value, shift:document.getElementById('sShift').value,
    join:document.getElementById('sDate').value, orders:0, rating:5.0, active:true});
  document.getElementById('staffModal').classList.remove('open');
  renderStaff(); showToast('Staff added', name + ' added to team.', '✅');
}
function showToast(msg, sub, icon='✅') {
  const t = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg; document.getElementById('toastSub').textContent = sub;
  document.getElementById('toastIcon').textContent = icon;
  t.style.display = 'flex'; t.classList.remove('hide');
  setTimeout(() => { t.classList.add('hide'); setTimeout(()=>{ t.style.display='none'; t.classList.remove('hide'); }, 300); }, 3500);
}
document.getElementById('staffModal').addEventListener('click', e => { if(e.target===document.getElementById('staffModal')) document.getElementById('staffModal').classList.remove('open'); });
renderStaff();
</script>

<!-- Auth Guard -->
<script>
(function() {
  var tok = localStorage.getItem("saveur_token") || sessionStorage.getItem("saveur_token");
  if (!tok) { window.location.href = "login.html"; return; }
  // Validate token not expired (8 hour limit)
  try {
    var payload = JSON.parse(atob(tok));
    var AGE_LIMIT = 8 * 60 * 60 * 1000;
    if (!payload.ts || (Date.now() - payload.ts) >= AGE_LIMIT) {
      localStorage.removeItem("saveur_token"); localStorage.removeItem("saveur_user");
      sessionStorage.removeItem("saveur_token");
      window.location.href = "login.html"; return;
    }
    var token = tok;
  } catch(e) {
    localStorage.removeItem("saveur_token"); localStorage.removeItem("saveur_user");
    sessionStorage.removeItem("saveur_token");
    window.location.href = "login.html"; return;
  }
  try {
    var user = JSON.parse(localStorage.getItem("saveur_user") || "{}");
    var el = document.getElementById("sidebar-username");
    if (el && user.name) el.textContent = user.name;
  } catch(e) {}
})();
function saveurLogout() {
  localStorage.removeItem("saveur_token");
  localStorage.removeItem("saveur_user");
  sessionStorage.removeItem("saveur_token");
  window.location.href = "login.html";
}
</script>
</body>
</html>
