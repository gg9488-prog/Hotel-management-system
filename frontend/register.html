<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Saveur — Create Account</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-base:#0a0a0c; --bg-surface:#111115; --bg-card:#16161c; --bg-hover:#1e1e26;
      --border:#2a2a35; --border-glow:rgba(196,155,76,0.35);
      --gold:#c49b4c; --gold-light:#e8c47a; --gold-dim:rgba(196,155,76,0.12);
      --text-primary:#f0ede6; --text-secondary:#8a8799; --text-muted:#4a4860;
      --danger:#e05c5c; --success:#4caf82; --warning:#e8a04c;
      --radius-md:12px; --radius-lg:20px;
      --shadow-card:0 8px 40px rgba(0,0,0,0.6);
      --shadow-glow:0 0 40px rgba(196,155,76,0.12);
      --transition:all 0.3s cubic-bezier(0.4,0,0.2,1);
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'DM Sans',sans-serif;background:var(--bg-base);color:var(--text-primary);
      min-height:100vh;display:flex;align-items:center;justify-content:center;
      position:relative;overflow-x:hidden;}
    body::before{content:'';position:fixed;top:-30%;left:-20%;width:55%;height:55%;
      background:radial-gradient(ellipse,rgba(196,155,76,0.07) 0%,transparent 70%);pointer-events:none;}
    body::after{content:'';position:fixed;bottom:-30%;right:-20%;width:55%;height:55%;
      background:radial-gradient(ellipse,rgba(196,155,76,0.05) 0%,transparent 70%);pointer-events:none;}

    .wrap{width:100%;max-width:460px;padding:24px;position:relative;z-index:1;}
    .card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);
      padding:44px 44px 40px;box-shadow:var(--shadow-card),var(--shadow-glow);
      animation:slideUp .5s cubic-bezier(.4,0,.2,1) both;}
    @keyframes slideUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}

    /* Logo */
    .logo{text-align:center;margin-bottom:28px;}
    .logo .icon{font-size:44px;display:block;margin-bottom:10px;
      filter:drop-shadow(0 0 16px rgba(196,155,76,0.4));}
    .logo h1{font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:700;
      background:linear-gradient(135deg,var(--gold-light),var(--gold));
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
      line-height:1;margin-bottom:6px;}
    .logo p{font-size:11px;color:var(--text-muted);letter-spacing:.12em;text-transform:uppercase;}

    .divider{height:1px;background:linear-gradient(90deg,transparent,var(--border),transparent);margin-bottom:24px;}
    .heading{font-size:16px;font-weight:600;color:var(--text-primary);margin-bottom:4px;}
    .subheading{font-size:13px;color:var(--text-secondary);margin-bottom:24px;}

    /* Steps */
    .steps{display:flex;align-items:center;justify-content:center;gap:0;margin-bottom:24px;}
    .step{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-muted);}
    .step.active{color:var(--gold-light);font-weight:600;}
    .step.done{color:var(--success);}
    .step-dot{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--border);
      display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;}
    .step.active .step-dot{border-color:var(--gold);background:var(--gold-dim);color:var(--gold-light);}
    .step.done   .step-dot{border-color:var(--success);background:rgba(76,175,130,0.12);color:var(--success);}
    .step-line{width:36px;height:1px;background:var(--border);margin:0 4px;}

    /* Inputs */
    .field{margin-bottom:16px;}
    .field label{display:block;font-size:11px;font-weight:600;color:var(--text-secondary);
      letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px;}
    .input-wrap{position:relative;}
    .icon-left{position:absolute;left:14px;top:50%;transform:translateY(-50%);
      font-size:14px;opacity:.5;pointer-events:none;}
    .field input,.field select{width:100%;background:var(--bg-surface);border:1px solid var(--border);
      border-radius:var(--radius-md);padding:12px 14px 12px 40px;font-family:'DM Sans',sans-serif;
      font-size:14px;color:var(--text-primary);outline:none;transition:var(--transition);}
    .field select{padding-left:14px;appearance:none;cursor:pointer;}
    .field input::placeholder{color:var(--text-muted);}
    .field input:focus,.field select:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-dim);background:var(--bg-hover);}
    .field input.ok{border-color:var(--success);}
    .field input.bad{border-color:var(--danger);}
    .hint{font-size:11px;margin-top:5px;min-height:14px;}
    .hint.ok{color:var(--success);} .hint.bad{color:var(--danger);}

    .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}

    /* Password toggle */
    .pwd-eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);
      background:none;border:none;cursor:pointer;font-size:15px;color:var(--text-muted);
      padding:4px;transition:color .2s;}
    .pwd-eye:hover{color:var(--gold);}

    /* Strength */
    .strength-row{display:flex;gap:4px;margin-top:8px;}
    .seg{flex:1;height:3px;border-radius:99px;background:var(--border);transition:background .3s;}

    /* Banners */
    .banner{display:none;border-radius:var(--radius-md);padding:12px 16px;margin-bottom:18px;
      font-size:13px;align-items:center;gap:10px;}
    .banner.show{display:flex;animation:fadeIn .3s ease;}
    .banner.err{background:rgba(224,92,92,.1);border:1px solid rgba(224,92,92,.3);color:var(--danger);}
    .banner.suc{background:rgba(76,175,130,.1);border:1px solid rgba(76,175,130,.3);color:var(--success);}
    @keyframes fadeIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}

    /* Terms */
    .terms{display:flex;align-items:flex-start;gap:10px;margin-bottom:18px;
      font-size:13px;color:var(--text-secondary);}
    .terms input{width:15px;height:15px;accent-color:var(--gold);cursor:pointer;flex-shrink:0;margin-top:2px;}
    .terms a{color:var(--gold);text-decoration:none;}

    /* Button */
    .btn-main{width:100%;padding:14px;background:linear-gradient(135deg,var(--gold),#a07830);
      border:none;border-radius:var(--radius-md);font-family:'DM Sans',sans-serif;
      font-size:15px;font-weight:600;color:#0a0a0c;letter-spacing:.04em;cursor:pointer;
      transition:var(--transition);display:flex;align-items:center;justify-content:center;gap:8px;}
    .btn-main:hover:not(:disabled){background:linear-gradient(135deg,var(--gold-light),var(--gold));
      transform:translateY(-1px);box-shadow:0 6px 24px rgba(196,155,76,0.35);}
    .btn-main:disabled{opacity:.6;cursor:not-allowed;transform:none;}
    .spinner{display:none;width:16px;height:16px;border:2px solid rgba(10,10,12,.3);
      border-top-color:#0a0a0c;border-radius:50%;animation:spin .6s linear infinite;}
    .loading .btn-text{display:none;} .loading .spinner{display:block;}
    @keyframes spin{to{transform:rotate(360deg)}}

    .signin-row{text-align:center;margin-top:22px;padding-top:22px;
      border-top:1px solid var(--border);font-size:13px;color:var(--text-secondary);}
    .signin-row a{color:var(--gold);font-weight:600;text-decoration:none;margin-left:5px;}
    .signin-row a:hover{color:var(--gold-light);}

    .footer{text-align:center;margin-top:18px;font-size:12px;color:var(--text-muted);}
    .footer span{color:var(--gold);}

    select option{background:var(--bg-card);}
    @media(max-width:500px){.card{padding:32px 22px 28px;} .row2{grid-template-columns:1fr;}}
  </style>
</head>
<body>
<div class="wrap">
  <div class="card">

    <div class="logo">
      <span class="icon">🍽️</span>
      <h1>Saveur</h1>
      <p>Restaurant Management Suite</p>
    </div>

    <!-- Steps -->
    <div class="steps">
      <div class="step active" id="s1"><div class="step-dot">1</div><span>Create Account</span></div>
      <div class="step-line"></div>
      <div class="step" id="s2"><div class="step-dot">2</div><span>Sign In</span></div>
      <div class="step-line"></div>
      <div class="step" id="s3"><div class="step-dot">3</div><span>Dashboard</span></div>
    </div>

    <div class="divider"></div>
    <div class="heading">Create your account</div>
    <div class="subheading">Your credentials will be saved and used to sign in</div>

    <!-- Banners -->
    <div class="banner err" id="errBanner"><span>⚠️</span><span id="errMsg"></span></div>
    <div class="banner suc" id="sucBanner"><span>✅</span><span id="sucMsg"></span></div>

    <form id="regForm" onsubmit="handleRegister(event)" novalidate>

      <!-- Full Name -->
      <div class="field">
        <label>Full Name *</label>
        <div class="input-wrap">
          <span class="icon-left">✨</span>
          <input type="text" id="fname" placeholder="e.g. Arjun Mehta" oninput="validateName(this)" autocomplete="name" />
        </div>
        <div class="hint" id="fNameHint"></div>
      </div>

      <!-- Username + Role -->
      <div class="row2">
        <div class="field">
          <label>Username *</label>
          <div class="input-wrap">
            <span class="icon-left">👤</span>
            <input type="text" id="uname" placeholder="e.g. arjun_m" oninput="validateUsername(this)" autocomplete="username" />
          </div>
          <div class="hint" id="unameHint"></div>
        </div>
        <div class="field">
          <label>Role</label>
          <select id="role">
            <option value="staff">👨‍🍳 Staff</option>
            <option value="manager">💼 Manager</option>
            <option value="chef">🧑‍🍳 Chef</option>
            <option value="cashier">💰 Cashier</option>
            <option value="admin">⚙️ Admin</option>
          </select>
        </div>
      </div>

      <!-- Password -->
      <div class="field">
        <label>Password *</label>
        <div class="input-wrap">
          <span class="icon-left">🔒</span>
          <input type="password" id="pwd" placeholder="Minimum 6 characters" oninput="checkStrength()" autocomplete="new-password" />
          <button type="button" class="pwd-eye" onclick="togglePwd('pwd',this)">👁️</button>
        </div>
        <div class="strength-row">
          <div class="seg" id="seg1"></div><div class="seg" id="seg2"></div>
          <div class="seg" id="seg3"></div><div class="seg" id="seg4"></div>
        </div>
        <div class="hint" id="strHint"></div>
      </div>

      <!-- Confirm -->
      <div class="field">
        <label>Confirm Password *</label>
        <div class="input-wrap">
          <span class="icon-left">🔐</span>
          <input type="password" id="cpwd" placeholder="Re-enter your password" oninput="checkConfirm()" autocomplete="new-password" />
          <button type="button" class="pwd-eye" onclick="togglePwd('cpwd',this)">👁️</button>
        </div>
        <div class="hint" id="cpwdHint"></div>
      </div>

      <!-- Terms -->
      <div class="terms">
        <input type="checkbox" id="terms" />
        <label for="terms">I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></label>
      </div>

      <button type="submit" class="btn-main" id="regBtn">
        <span class="btn-text">✦ Create Account</span>
        <span class="spinner"></span>
      </button>
    </form>

    <div class="signin-row">Already have an account? <a href="login.html">Sign In →</a></div>
  </div>
  <div class="footer">&copy; 2025 <span>Saveur</span> · Restaurant Management Suite</div>
</div>

<script>
// ── If already logged in → dashboard ──────────────────────────────────
(function() {
  var tok = localStorage.getItem('saveur_token') || sessionStorage.getItem('saveur_token');
  if (!tok) return;
  try {
    var p = JSON.parse(atob(tok));
    if (p.ts && (Date.now() - p.ts) < 8*60*60*1000) {
      window.location.href = 'index.html';
    } else {
      localStorage.removeItem('saveur_token'); localStorage.removeItem('saveur_user');
      sessionStorage.removeItem('saveur_token');
    }
  } catch(e) {
    localStorage.removeItem('saveur_token'); localStorage.removeItem('saveur_user');
    sessionStorage.removeItem('saveur_token');
  }
})();

// ── Password toggle ───────────────────────────────────────────────────
function togglePwd(id, btn) {
  const el = document.getElementById(id);
  el.type  = el.type === 'text' ? 'password' : 'text';
  btn.textContent = el.type === 'text' ? '🙈' : '👁️';
}

// ── Validation ────────────────────────────────────────────────────────
function validateName(inp) {
  const v = inp.value.trim();
  const h = document.getElementById('fNameHint');
  if (!v)         { inp.className=''; h.className='hint'; h.textContent=''; return false; }
  if (v.length<2) { inp.className='bad'; h.className='hint bad'; h.textContent='Name too short'; return false; }
  inp.className='ok'; h.className='hint ok'; h.textContent='✓ Looks good'; return true;
}

function validateUsername(inp) {
  const v = inp.value.trim();
  const h = document.getElementById('unameHint');
  if (!v)                           { inp.className=''; h.className='hint'; h.textContent=''; return false; }
  if (v.length < 3)                 { inp.className='bad'; h.className='hint bad'; h.textContent='Min 3 characters'; return false; }
  if (!/^[a-zA-Z0-9_.-]+$/.test(v)){ inp.className='bad'; h.className='hint bad'; h.textContent='Only letters, numbers, _ . -'; return false; }

  // Check duplicate in localStorage
  const accounts = JSON.parse(localStorage.getItem('saveur_accounts') || '[]');
  const taken = accounts.some(a => a.username.toLowerCase() === v.toLowerCase());
  if (taken) { inp.className='bad'; h.className='hint bad'; h.textContent='Username already taken'; return false; }

  inp.className='ok'; h.className='hint ok'; h.textContent='✓ Available'; return true;
}

const STR_COLORS = ['', '#e05c5c', '#e8a04c', '#c49b4c', '#4caf82'];
const STR_LABELS = ['', 'Weak', 'Fair', 'Good', 'Strong'];

function checkStrength() {
  const v = document.getElementById('pwd').value;
  let score = 0;
  if (v.length >= 6)  score++;
  if (v.length >= 10) score++;
  if (/[A-Z]/.test(v) && /[a-z]/.test(v)) score++;
  if (/[0-9]/.test(v) || /[^a-zA-Z0-9]/.test(v)) score++;
  for (let i = 1; i <= 4; i++) {
    document.getElementById('seg'+i).style.background = i <= score ? STR_COLORS[score] : 'var(--border)';
  }
  const h = document.getElementById('strHint');
  if (v) { h.textContent = 'Strength: ' + (STR_LABELS[score]||'Weak'); h.className = 'hint '+(score>=3?'ok':score===2?'':'bad'); }
  else   { h.textContent = ''; }
  checkConfirm();
}

function checkConfirm() {
  const p = document.getElementById('pwd').value;
  const c = document.getElementById('cpwd').value;
  const h = document.getElementById('cpwdHint');
  const el= document.getElementById('cpwd');
  if (!c) { el.className=''; h.className='hint'; h.textContent=''; return false; }
  if (p !== c) { el.className='bad'; h.className='hint bad'; h.textContent='Passwords do not match'; return false; }
  el.className='ok'; h.className='hint ok'; h.textContent='✓ Passwords match'; return true;
}

// ── Register ──────────────────────────────────────────────────────────
function handleRegister(e) {
  e.preventDefault();
  clearBanners();

  const name     = document.getElementById('fname').value.trim();
  const username = document.getElementById('uname').value.trim();
  const password = document.getElementById('pwd').value;
  const confirm  = document.getElementById('cpwd').value;
  const role     = document.getElementById('role').value;
  const terms    = document.getElementById('terms').checked;

  // Validate
  if (!name || name.length < 2)              { showErr('Please enter your full name (min 2 characters).'); return; }
  if (!username || username.length < 3)      { showErr('Username must be at least 3 characters.'); return; }
  if (!/^[a-zA-Z0-9_.-]+$/.test(username))  { showErr('Username: only letters, numbers, _ . - allowed.'); return; }
  if (password.length < 6)                   { showErr('Password must be at least 6 characters.'); return; }
  if (password !== confirm)                  { showErr('Passwords do not match. Please re-enter.'); return; }
  if (!terms)                                { showErr('Please accept the Terms of Service to continue.'); return; }

  // Check duplicate
  const accounts = JSON.parse(localStorage.getItem('saveur_accounts') || '[]');
  if (accounts.some(a => a.username.toLowerCase() === username.toLowerCase())) {
    showErr('That username is already taken. Please choose another.'); return;
  }

  // Fake loading
  const btn = document.getElementById('regBtn');
  btn.classList.add('loading'); btn.disabled = true;

  setTimeout(() => {
    // Save account to localStorage
    accounts.push({ id: Date.now().toString(), username, password, name, role, createdAt: new Date().toISOString() });
    localStorage.setItem('saveur_accounts', JSON.stringify(accounts));

    // Mark step 1 done
    document.getElementById('s1').className = 'step done';
    document.getElementById('s1').querySelector('.step-dot').textContent = '✓';
    document.getElementById('s2').className = 'step active';

    showSuc(`Account created for "${name}"! Redirecting to login…`);
    btn.classList.remove('loading'); btn.disabled = false;

    // Redirect to login with username prefilled
    setTimeout(() => {
      window.location.href = 'login.html?user=' + encodeURIComponent(username) + '&registered=1';
    }, 1800);
  }, 600);
}

function showErr(msg) { document.getElementById('errMsg').textContent=msg; document.getElementById('errBanner').classList.add('show'); }
function showSuc(msg) { document.getElementById('sucMsg').textContent=msg; document.getElementById('sucBanner').classList.add('show'); }
function clearBanners() { document.getElementById('errBanner').classList.remove('show'); document.getElementById('sucBanner').classList.remove('show'); }

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && document.activeElement.tagName !== 'BUTTON' && document.activeElement.tagName !== 'SELECT') {
    handleRegister(new Event('submit'));
  }
});
</script>
</body>
</html>
